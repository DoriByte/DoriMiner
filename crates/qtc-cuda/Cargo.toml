[package]
name = "qtc-cuda"
version.workspace = true
edition.workspace = true
publish.workspace = true

license = "PolyForm-Noncommercial-1.0.0"
description = "CUDA QPoW search, candidates verified on the CPU"
build = "build.rs"

[dependencies]
cudarc = { version = "0.19.9", default-features = false, features = [
	"cuda-12040",
	"driver",
	"dynamic-loading",
	"fallback-dynamic-loading",
	"nvrtc",
	"std",
] }
log = { workspace = true }
primitive-types = { workspace = true }
qtc-pow = { path = "../qtc-pow" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
hex = { workspace = true }
