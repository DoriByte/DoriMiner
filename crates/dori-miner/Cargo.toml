[package]
name = "dori-miner"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "DoriMiner: NVIDIA miner for Quantus (QTC), Pearl (PRL), Ergo (ERG) and Vela (VELA), with an optional 1% dev fee"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
getrandom = "0.2"
hex = { workspace = true }
libloading = "0.9"
log = { workspace = true }
primitive-types = { workspace = true }
prl-cuda = { path = "../prl-cuda" }
prl-pow = { path = "../prl-pow" }
qtc-cuda = { path = "../qtc-cuda" }
qtc-pow = { path = "../qtc-pow" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
vela-cuda = { path = "../vela-cuda" }
erg-cuda = { path = "../erg-cuda" }
